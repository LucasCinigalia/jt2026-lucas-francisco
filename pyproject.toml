[project]
name = "invest-itapema"
version = "0.1.0"
description = "Recomendação de investimento imobiliário em Itapema (SC) para a Seazone"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "duckdb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invest"]
